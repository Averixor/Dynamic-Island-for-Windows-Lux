name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # No -G: CMake 4.2+ picks the newest Visual Studio it finds.
        # windows-latest is VS 2026 (generator "Visual Studio 18 2026");
        # windows-2022 is still VS 2022. -A x64 selects the platform either way.
        run: cmake -S app -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: JSON self-test
        shell: pwsh
        run: |
          & './build/Release/Dynamic Island Lux.exe' --test-json

      - name: Smoke without workers
        shell: pwsh
        run: |
          & './build/Release/Dynamic Island Lux.exe' --smoke-test --no-workers

      - name: Validate YouTube bridge extension
        shell: pwsh
        run: |
          node --check extensions/youtube-bridge/content.js
          node --check extensions/youtube-bridge/background.js
          node --check extensions/youtube-bridge/popup.js
          node -e "for (const name of ['extensions/youtube-bridge/manifest.json','extensions/youtube-bridge/manifest.firefox.json']) { const m = JSON.parse(require('fs').readFileSync(name,'utf8')); if (m.manifest_version !== 3) throw new Error(name + ' is not MV3'); }"
